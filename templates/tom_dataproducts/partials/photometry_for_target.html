<div class="d-flex justify-content-between align-items-start mb-2">
  <h4 class="mb-0">Photometry</h4>
  {% if request and request.user and request.user.is_staff %}
    <a href="{% url 'dataproducts:update-reduced-data' %}?target_id={{ target.id }}&force_all_dataservices=1"
       class="btn btn-primary"
       title="Update Targets"
       onclick="return confirm('Are you sure you want to query all DataServices for this target?');">Check for new data</a>
  {% endif %}
</div>
<div class="light-curve">
  {{ plot|safe }}
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.light-curve .plotly-graph-div').forEach(function (plot) {
      if (plot.dataset.measurementLinksBound === '1' || typeof plot.on !== 'function') return;
      plot.dataset.measurementLinksBound = '1';
      plot.on('plotly_click', function (event) {
        const point = event && event.points && event.points[0];
        const link = point && point.customdata && point.customdata[1];
        if (typeof link === 'string' && link.startsWith('/dataproducts/')) {
          window.location.assign(link);
        }
      });
    });
  });
</script>
{% if highenergy_plot %}
<div class="mt-4">
  <h4>High-Energy Light Curve</h4>
  <div class="light-curve">
    {{ highenergy_plot|safe }}
  </div>
</div>
{% endif %}
